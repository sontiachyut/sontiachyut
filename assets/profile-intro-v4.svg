<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Achyutaram — Software Engineer</title>
  <desc id="desc">Software engineer. Backend, distributed systems, and applied AI. A small code window with colorful brackets, a blinking terminal cursor, and a Git branch illustration sits beside the introduction.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.4s step-end infinite; }
    .commit { animation: pulse 4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .commit { animation: none; } }
  </style>

  <rect width="1000" height="260" rx="12" fill="#18242c"/>

  <!-- A short introduction, with room for platform font differences. -->
  <text x="44" y="58" fill="#9eb1bb" font-size="17" letter-spacing="2">SOFTWARE ENGINEER</text>
  <text x="42" y="118" fill="#faf4e8" font-size="43" font-weight="600" letter-spacing="-1">Hi, I'm Achyutaram.</text>
  <rect x="44" y="141" width="42" height="4" rx="2" fill="#f08d75"/>
  <text x="44" y="188" fill="#d6e1e5" font-size="24">Backend &amp; distributed systems.</text>
  <text x="44" y="223" fill="#90cdc4" font-size="24">Currently building with applied AI.</text>

  <!-- The code motif is drawn as paths so it cannot shift with fallback fonts. -->
  <g transform="translate(678 35)">
    <rect x="12" y="12" width="250" height="174" rx="12" fill="none" stroke="#34454e"/>
    <rect width="250" height="174" rx="12" fill="#111d24" stroke="#526870" stroke-width="1.5"/>
    <path d="M 1 33 H 249" stroke="#34454e"/>
    <circle cx="17" cy="17" r="3.5" fill="#f08d75"/>
    <circle cx="31" cy="17" r="3.5" fill="#e8bb74"/>
    <circle cx="45" cy="17" r="3.5" fill="#90cdc4"/>
    <text x="230" y="22" text-anchor="end" fill="#9eb1bb" font-size="12" style="font-family: ui-monospace, Menlo, Consolas, monospace">~/code</text>

    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 91 62 L 68 83 L 91 104" stroke="#90cdc4"/>
      <path d="M 136 57 L 115 109" stroke="#e8bb74"/>
      <path d="M 159 62 L 182 83 L 159 104" stroke="#f08d75"/>
    </g>
    <g stroke-width="3" stroke-linecap="round">
      <path d="M 62 124 H 84" stroke="#f08d75"/>
      <path d="M 94 124 H 143" stroke="#526870"/>
      <path d="M 153 124 H 184" stroke="#90cdc4"/>
    </g>
    <path d="M 1 140 H 249" stroke="#34454e"/>
    <path d="M 18 150 L 24 155 L 18 160" fill="none" stroke="#9adca4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="cursor" x="33" y="150" width="7" height="11" rx="1" fill="#9adca4"/>

    <path d="M 22 205 H 212 M 81 205 C 102 205 100 188 121 188 H 153" fill="none" stroke="#526870" stroke-width="1.5"/>
    <g fill="#18242c" stroke-width="2">
      <circle cx="22" cy="205" r="4" stroke="#90cdc4"/>
      <circle cx="81" cy="205" r="4" stroke="#90cdc4"/>
      <circle cx="153" cy="188" r="4" stroke="#f08d75"/>
      <circle cx="212" cy="205" r="4" stroke="#9adca4"/>
    </g>
    <circle class="commit" cx="212" cy="205" r="9" fill="none" stroke="#9adca4" opacity=".25"/>
  </g>
</svg>
