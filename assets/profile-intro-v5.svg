<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Achyutaram — Software Engineer</title>
  <desc id="desc">Backend, distributed systems, and applied AI. A mint and ice-blue Git graph shows a commit traveling along a feature branch and merging into main.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .merge { animation: merged 6s ease-out infinite; }
    @keyframes merged {
      0%, 78%, 100% { opacity: 0; }
      82% { opacity: .8; }
      96% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .moving { display: none; }
      .merge { animation: none; opacity: 0; }
    }
  </style>

  <rect width="1000" height="260" rx="12" fill="#101820"/>
  <text x="44" y="58" fill="#92a8b3" font-size="17" letter-spacing="2">SOFTWARE ENGINEER</text>
  <text x="42" y="118" fill="#f5f5ed" font-size="43" font-weight="600" letter-spacing="-1">Hi, I'm Achyutaram.</text>
  <rect x="44" y="141" width="42" height="4" rx="2" fill="#89e5c0"/>
  <text x="44" y="188" fill="#d5e2e7" font-size="24">Backend &amp; distributed systems.</text>
  <text x="44" y="223" fill="#89e5c0" font-size="24">Currently building with applied AI.</text>

  <!-- A feature branch diverges from main and returns at the merge commit. -->
  <g transform="translate(674 44)">
    <text x="10" y="29" fill="#92a8b3" font-size="14" style="font-family: ui-monospace, Menlo, Consolas, monospace">git /</text>
    <path d="M 10 119 H 266" fill="none" stroke="#325248" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 55 119 C 80 119 76 54 104 54 H 155 C 188 54 178 119 211 119" fill="none" stroke="#9ccff0" stroke-width="2.5" stroke-linecap="round"/>

    <g fill="#101820" stroke-width="2.5">
      <circle cx="10" cy="119" r="6" stroke="#89e5c0"/>
      <circle cx="55" cy="119" r="6" stroke="#89e5c0"/>
      <circle cx="121" cy="119" r="6" stroke="#89e5c0"/>
      <circle cx="211" cy="119" r="8" stroke="#89e5c0"/>
      <circle cx="266" cy="119" r="6" stroke="#89e5c0"/>
      <circle cx="104" cy="54" r="6" stroke="#9ccff0"/>
      <circle cx="155" cy="54" r="6" stroke="#9ccff0"/>
    </g>

    <g fill="#92a8b3" font-size="13" style="font-family: ui-monospace, Menlo, Consolas, monospace">
      <text x="104" y="29" fill="#9ccff0">feature</text>
      <text x="10" y="153" fill="#89e5c0">main</text>
    </g>

    <circle class="moving" r="4" fill="#f5f5ed" opacity="0">
      <animateMotion path="M 55 119 C 80 119 76 54 104 54 H 155 C 188 54 178 119 211 119" dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1;0.8;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.78;0.8;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle class="merge" cx="211" cy="119" r="15" fill="none" stroke="#89e5c0" stroke-width="1.5" opacity="0"/>
    <circle cx="211" cy="119" r="3" fill="#89e5c0"/>
  </g>
</svg>
